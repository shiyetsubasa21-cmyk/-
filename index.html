<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 Device Roadmap</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            text-align: center;
            color: var(--accent);
        }

        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-item {
            text-align: center;
        }

        .summary-item .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .summary-item .val {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-green);
        }

        .add-form {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .add-form h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        button.btn-add {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 6px;
        }

        button.btn-add:active {
            opacity: 0.8;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-card.purchased {
            opacity: 0.5;
            text-decoration: line-through;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-icon {
            font-size: 1.5rem;
        }

        .item-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .item-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .item-right {
            text-align: right;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-price {
            font-weight: bold;
            color: var(--accent-green);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>📱 2027 Device Roadmap</h1>

    <!-- 自動計算エリア -->
    <div class="summary-card">
        <div class="summary-item">
            <div class="label">全デバイス数</div>
            <div class="val" id="total-count">0 件</div>
        </div>
        <div class="summary-item">
            <div class="label">購入済み</div>
            <div class="val" id="bought-count">0 件</div>
        </div>
        <div class="summary-item">
            <div class="label">合計金額</div>
            <div class="val" id="total-price">¥0</div>
        </div>
    </div>

    <!-- 追加フォーム -->
    <div class="add-form">
        <h2>➕ 新しいデバイスを追加</h2>
        <div class="input-group">
            <input type="text" id="name-input" placeholder="デバイス名 (例: iPad mini 7)" required>
            <input type="text" id="date-input" placeholder="時期 (例: 2027年 春)">
            <input type="number" id="price-input" placeholder="金額 (半角数字)" required>
            <button class="btn-add" onclick="addItem()">追加する</button>
        </div>
    </div>

    <!-- リスト表示エリア -->
    <div class="item-list" id="item-list"></div>

    <script>
        // デフォルトデータ（初回のみ使用）
        const defaultItems = [
            { id: 1, name: "iPhone 18 Pro", date: "2026年 秋", price: 180000, bought: false },
            { id: 2, name: "MacBook Air M4", date: "2027年 春", price: 160000, bought: false }
        ];

        // ローカルストレージからデータ取得、なければデフォルトをセット
        let items = JSON.parse(localStorage.getItem('device_roadmap_items')) || defaultItems;

        function saveData() {
            localStorage.setItem('device_roadmap_items', JSON.stringify(items));
        }

        function render() {
            const listEl = document.getElementById('item-list');
            listEl.innerHTML = '';

            let totalPrice = 0;
            let boughtCount = 0;

            items.forEach(item => {
                totalPrice += Number(item.price);
                if (item.bought) boughtCount++;

                const card = document.createElement('div');
                card.className = `item-card ${item.bought ? 'purchased' : ''}`;
                card.innerHTML = `
                    <div class="item-left">
                        <input type="checkbox" ${item.bought ? 'checked' : ''} onchange="toggleBought(${item.id})">
                        <div>
                            <div class="item-title">${escapeHtml(item.name)}</div>
                            <div class="item-date">${escapeHtml(item.date || '時期未定')}</div>
                        </div>
                    </div>
                    <div class="item-right">
                        <div class="item-price">¥${Number(item.price).toLocaleString()}</div>
                        <button class="btn-delete" onclick="deleteItem(${item.id})">🗑️</button>
                    </div>
                `;
                listEl.appendChild(card);
            });

            // 集計データの更新
            document.getElementById('total-count').innerText = `${items.length} 件`;
            document.getElementById('bought-count').innerText = `${boughtCount} 件`;
            document.getElementById('total-price').innerText = `¥${totalPrice.toLocaleString()}`;
        }

        function addItem() {
            const nameEl = document.getElementById('name-input');
            const dateEl = document.getElementById('date-input');
            const priceEl = document.getElementById('price-input');

            if (!nameEl.value.trim() || !priceEl.value) {
                alert('デバイス名と金額を入力してください。');
                return;
            }

            const newItem = {
                id: Date.now(),
                name: nameEl.value.trim(),
                date: dateEl.value.trim(),
                price: Number(priceEl.value),
                bought: false
            };

            items.push(newItem);
            saveData();
            render();

            // フォームのリセット
            nameEl.value = '';
            dateEl.value = '';
            priceEl.value = '';
        }

        function toggleBought(id) {
            items = items.map(item => item.id === id ? { ...item, bought: !item.bought } : item);
            saveData();
            render();
        }

        function deleteItem(id) {
            if (confirm('本当に削除しますか？')) {
                items = items.filter(item => item.id !== id);
                saveData();
                render();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // 初回描画
        render();
    </script>
</body>
</html>
